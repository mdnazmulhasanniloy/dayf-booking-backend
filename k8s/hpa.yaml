apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dayf-backend
  namespace: dayf-booking
  labels:
    app.kubernetes.io/name: dayf-backend
    app.kubernetes.io/part-of: dayf-booking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dayf-backend
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
