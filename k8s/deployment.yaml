apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayf-backend
  namespace: dayf-booking
  labels:
    app.kubernetes.io/name: dayf-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dayf-booking
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dayf-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dayf-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: dayf-booking
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until redis-cli -h "$REDIS_HOST" -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; do sleep 2; done
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dayf-backend-secret
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: nazmulhasn/dayf-booking-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dayf-backend-config
            - secretRef:
                name: dayf-backend-secret
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: LOG_LEVEL
            - name: IP
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: IP
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: PORT
            - name: SOCKET_PORT
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: SOCKET_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dayf-backend-config
                  key: REDIS_PORT
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: socket
              containerPort: 8005
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dayf-backend
