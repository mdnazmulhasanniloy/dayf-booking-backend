apiVersion: v1
kind: Service
metadata:
  name: dayf-redis
  namespace: dayf-booking
  labels:
    app.kubernetes.io/name: dayf-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: dayf-booking
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dayf-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dayf-redis
  namespace: dayf-booking
  labels:
    app.kubernetes.io/name: dayf-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: dayf-booking
spec:
  serviceName: dayf-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dayf-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dayf-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: dayf-booking
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dayf-backend-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: dayf-redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
