services:
  backend:
    image: nazmulhasn/dayf_booking_backend:latest
    container_name: dayf_booking_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    expose:
      - '1000'
      - '1005'
    depends_on:
      redis:
        condition: service_started
    networks:
      - dayf_booking_net
  redis:
    image: redis:7.2-alpine
    container_name: dayf_booking_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    expose:
      - '6379'
    networks:
      - dayf_booking_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  dayf_booking_net:
    driver: bridge
