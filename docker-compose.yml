services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: nazmulhasn/dayf-booking-backend:latest
    container_name: dayf_booking_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    expose:
      - '1000'
      - '1005'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dayf_booking_net
  redis:
    image: redis:7.2-alpine
    container_name: dayf_booking_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    expose:
      - '6379'
    networks:
      - dayf_booking_net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:

networks:
  dayf_booking_net:
    driver: bridge
